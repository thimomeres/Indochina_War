<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>The Third Indochina War</title>
  </head>

  <body>
    <div id="app" class="relative h-full w-full overflow-hidden bg-sky-200">
      <!-- =========================
           MAP
      ========================== -->
      <div id="map" class="absolute inset-0 h-full w-full"></div>

      <!-- =========================
           COUNTRY INFORMATION PANEL
      ========================== -->
      <aside
        id="country-panel"
        class="hidden absolute right-3 top-28 z-[1000] w-96 max-w-[calc(100%_-_1.5rem)] max-h-[calc(100%_-_13rem)] overflow-y-auto rounded-lg bg-white p-4 shadow-xl"
      >
        <div class="flex items-start justify-between">
          <h2 id="country-name" class="text-lg font-bold text-slate-900"></h2>

          <button
            id="country-close"
            type="button"
            aria-label="Close country information"
            class="ml-2 h-8 w-8 shrink-0 rounded-full text-lg text-slate-600 hover:bg-slate-100"
          >
            ✕
          </button>
        </div>

        <p
          id="country-role"
          class="mt-2 text-sm font-medium text-slate-800"
        ></p>

        <ul
          id="country-points"
          class="mt-3 list-disc space-y-2 pl-5 text-sm text-slate-700"
        ></ul>
      </aside>

      <!-- =========================
           EVENT POPUP
      ========================== -->
      <aside
        id="event-popup"
        class="hidden absolute bottom-24 left-3 z-[1000] w-96 max-w-[calc(100%_-_1.5rem)] max-h-[calc(100%_-_6.75rem)] overflow-y-auto rounded-lg bg-white p-4 shadow-xl"
      >
        <div class="flex items-start justify-between">
          <div class="flex items-start">
            <span
              id="event-icon"
              class="mr-3 text-2xl"
              aria-hidden="true"
            ></span>

            <div>
              <p
                id="event-date"
                class="text-xs font-semibold uppercase text-red-600"
              ></p>

              <h2
                id="event-title"
                class="text-base font-bold text-slate-900"
              ></h2>
            </div>
          </div>

          <button
            id="event-close"
            type="button"
            aria-label="Close event information"
            class="ml-2 h-8 w-8 shrink-0 rounded-full text-lg text-slate-600 hover:bg-slate-100"
          >
            ✕
          </button>
        </div>

        <ul
          id="event-description"
          class="mt-3 space-y-2 text-sm text-slate-700"
        ></ul>

        <div id="event-reactions-box" class="mt-3">
          <h3 class="text-xs font-semibold uppercase text-slate-500">
            International reactions
          </h3>

          <ul
            id="event-reactions"
            class="mt-1 list-disc space-y-1 pl-5 text-sm text-slate-700"
          ></ul>
        </div>
      </aside>

      <!-- =========================
           TIMELINE 1975–1991
      ========================== -->

      <!-- =========================
     TIMELINE 1975–1991
========================== -->
      <section
        id="timeline"
        class="absolute bottom-0 left-0 right-0 z-[1000] bg-white px-6 pb-3 pt-3 shadow-[0_-2px_8px_rgba(0,0,0,0.15)]"
      >
        <div class="flex items-center gap-4">
          <!-- Start year -->
          <span class="shrink-0 text-xs font-semibold text-slate-500">
            1975
          </span>

          <!-- Timeline track -->
          <div class="relative min-w-0 flex-1">
            <div class="relative h-10">
              <!-- Slider -->
              <input
                id="timeline-slider"
                type="range"
                min="0"
                max="8"
                step="1"
                value="0"
                aria-label="Timeline, 1975 to 1991"
                class="timeline-range absolute left-0 top-0 z-[1] w-full"
              />

              <!-- Event numbers -->
              <div
                id="timeline-labels"
                class="pointer-events-none absolute inset-0 z-[2]"
              ></div>
            </div>
          </div>

          <!-- End year -->
          <span class="shrink-0 text-xs font-semibold text-slate-500">
            1991
          </span>
        </div>
      </section>
    </div>

    <!-- Application entry point -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
